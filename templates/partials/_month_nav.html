{% load i18n %}
<div class="month-nav">

  <h1>{{ month|date:'F Y'|capfirst }}</h1>
  <a class="month-arrow" href="?month={{ next_month|date:'Y-m' }}" aria-label="{% translate 'Next month' %}">›</a>
</div>
