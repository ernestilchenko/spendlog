{% extends 'base.html' %}
{% load i18n %}
{% block title %}{% translate 'Delete rule' %}{% endblock %}
{% block content %}
<form method="post" class="card form">
  {% csrf_token %}
  <h1>{% translate 'Delete rule?' %}</h1>
  <p><code>{{ rule.pattern }}</code> → {{ rule.category.display_name }}</p>
  <div class="form-actions">
    <button type="submit" class="button button-danger">{% translate 'Delete' %}</button>
    <a href="{% url 'categories:rule_list' %}" class="button">{% translate 'Cancel' %}</a>
  </div>
</form>
{% endblock %}
