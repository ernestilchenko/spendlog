{% extends 'base.html' %}
{% load i18n %}
{% block title %}{% translate 'New rule' %}{% endblock %}
{% block content %}
<div class="page-head"><h1>{% translate 'New rule' %}</h1></div>
<form method="post" class="card form">
  {% csrf_token %}
  {% include 'partials/_form.html' %}
  <div class="form-actions">
    <button type="submit" class="button button-primary">{% translate 'Save' %}</button>
    <a href="{% url 'categories:rule_list' %}" class="button">{% translate 'Cancel' %}</a>
  </div>
</form>
{% endblock %}
